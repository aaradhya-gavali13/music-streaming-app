databases:
  - name: aurasound-db
    databaseName: aurasound
    user: aurasound
    plan: free

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: aurasound-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aurasound-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: MUSIC_PROVIDER
        value: audius
      - key: JAMENDO_CLIENT_ID
        value: 56d30c95

  # 2. React Frontend Static Site
  - type: web
    name: aurasound-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aurasound-backend
          property: host
